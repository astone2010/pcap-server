name: Check

on:
  # Branches only. A bare `push:` also matches a tag push, which is exactly
  # what fires release.yml -- so tagging a commit this same Check already
  # passed on the branch push ran the whole suite a second time against
  # nothing new. Tags carry no separate ref under refs/heads, so this filter
  # excludes them without needing to name release.yml's own 'v*' pattern here.
  push:
    branches: ['**']
    # Nothing in this suite reads README.md, docs/**, or CHANGELOG.md --
    # checked, not assumed -- and .claude/ is session scratch, so a push
    # touching only those already gets no coverage whether or not this runs.
    # .github/workflows/** is excluded too, now that lint-workflows.yml gives
    # it a real, purpose-built check of its own (actionlint: YAML syntax,
    # expression/context correctness, a shellcheck pass over `run:` blocks).
    # That check is static analysis, not execution, so it is NOT a full
    # substitute for this job actually running check.yml's steps -- it would
    # not catch e.g. a typo'd script path in the "Run tests" step. What it
    # does cover is the much more common mistake for a workflow edit: broken
    # YAML, a bad expression, an undefined context.
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/**'
      - '.claude/**'
      - '.github/workflows/**'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tshark and tcpdump
        env:
          # wireshark-common's postinst asks an interactive debconf question
          # about non-root capture; this must be set or the install hangs.
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tshark tcpdump

      # The browser itself is not a pip package. Installed here rather than in
      # scripts/check.sh so that running the checks locally never downloads a
      # browser behind a developer's back -- the script reports what it found
      # and the suites skip with the remedy in the reason.
      #
      # From the same pinned file the suites use, so the browser revision this
      # downloads is the one that playwright expects. It means installing the
      # dependencies twice on a CI run -- once here, once into the venv
      # scripts/check.sh builds -- which is a cheaper price than a second place
      # holding a playwright version that can drift from the first.
      - name: Install chromium for the browser suites
        run: |
          python -m pip install -q -r backend/requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Run tests
        run: ./scripts/check.sh
