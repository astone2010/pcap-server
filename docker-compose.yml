services:
  pcap-server:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./ssh-keys:/app/ssh-keys:ro
      - ./data:/app/data
      - ./captures:/app/captures
    environment:
      - SSH_KEYS_DIR=/app/ssh-keys
      - CAPTURES_DIR=/app/captures
      - DATA_DIR=/app/data
    restart: unless-stopped
