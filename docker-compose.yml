# ============================================================================
# FIRST-TIME SETUP
# ============================================================================
#
# 1. Create the data directory and the master key, on the Docker host:
#
#     sudo mkdir -p /opt/docker/pcapserver && sudo chown "$USER" /opt/docker/pcapserver
#     mkdir -p /opt/docker/pcapserver/{ssh-keys,data,captures,secrets}
#     chmod 0700 /opt/docker/pcapserver/{ssh-keys,data,captures,secrets}
#     openssl rand -base64 32 > /opt/docker/pcapserver/secrets/master.key
#     chmod 0400 /opt/docker/pcapserver/secrets/master.key
#
# 2. PASTE THE BLOCK BELOW INTO A FILE NAMED compose.yaml -- everything from
#    `services:` down to the END OF compose.yaml line. Put that file in
#    whatever directory you keep compose files in.
#
# 3. From the directory holding compose.yaml, start it and check it:
#
#     docker compose up -d
#     docker compose ps
#     docker compose logs pcap-server | grep -i encryption
#
#    You want `running` -- not `restarting` -- from `ps`, and
#    `encryption enabled (key id ...)` from the logs. Then open
#    http://<host>:8080 and create the admin account. Have an authenticator
#    app to hand: TOTP enrolment is part of creating it.
#
# 4. Back up secrets/master.key somewhere other than this machine.
#
# Using a different data directory than /opt/docker/pcapserver? Change it in
# step 1, and in the four `source:` lines and the `file:` line of the block.
#
# ============================ PASTE FROM HERE ===============================

services:
  pcap-server:
    image: ghcr.io/darthrater78/pcap-server:1.0.0
    ports:
      - "8080:8080"
    volumes:
      - type: bind
        source: /opt/docker/pcapserver/ssh-keys
        target: /app/ssh-keys
      - type: bind
        source: /opt/docker/pcapserver/data
        target: /app/data
      - type: bind
        source: /opt/docker/pcapserver/captures
        target: /app/captures
    environment:
      - SSH_KEYS_DIR=/app/ssh-keys
      - CAPTURES_DIR=/app/captures
      - DATA_DIR=/app/data
      - COOKIE_SECURE=false
      - MASTER_KEY_FILE=/run/secrets/pcap_master_key
    extra_hosts:
      - "host.docker.internal:host-gateway"
    secrets:
      - pcap_master_key
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

secrets:
  pcap_master_key:
    file: /opt/docker/pcapserver/secrets/master.key

# ============================ END OF compose.yaml ===========================
#
# Everything below is explanation, not more steps. None of it needs to be in
# your compose.yaml.
#
# ----------------------------------------------------------------------------
# WHAT EACH SETUP LINE IS FOR
#
#   mkdir       The four directories the block bind-mounts. All four must exist
#               BEFORE the first start, or Docker creates them itself as
#               root-owned -- or creates a directory where you meant a file.
#
#   chmod 0700  Closes them to other accounts on this host. Not belt-and-braces:
#               at a default umask they are world-readable, and data/ holds the
#               SQLite database, which stores every user's TOTP secret as plain
#               text because the app has to compute codes from it. Anyone who
#               can read that file can produce a valid second factor for any
#               account. Password hashes are scrypt and sessions are kept as
#               digests, so those are a slower problem; the TOTP seeds are the
#               immediate one.
#
#   openssl     The master key, generated once, before the first start. The app
#               refuses to start without one rather than storing captures in the
#               clear. 0400 because it is the one file that opens all the rest.
#
# ----------------------------------------------------------------------------
# WHERE THE PATHS RESOLVE
#
# The volumes and the secret's `file:` are absolute paths, not `./` paths, so
# they don't care where compose.yaml sits. Only the `docker compose` commands
# need to run from its directory; the data directory can be anywhere.
#
# Pick the data directory deliberately: it holds your captures and the key that
# decrypts them. Moving it means changing each `source:` and the secret's
# `file:`, keeping every `target:` exactly as it is:
#
#        source: /opt/docker/pcapserver/captures
#        target: /app/captures          # unchanged -- this is inside the container
#
# ----------------------------------------------------------------------------
# THE MASTER KEY
#
# Captures are encrypted with secrets/master.key and there is no recovery path:
# lose the key and every stored capture is gone. Keep a copy somewhere else, and
# keep it OUT of data/ and captures/ -- a key stored beside the data it protects
# protects nothing.
#
# It is passed as a file (MASTER_KEY_FILE, mounted as a Compose secret), not a
# variable: an environment variable is readable via `docker inspect` and
# /proc/<pid>/environ.
#
# If the key is ever exposed, do not just overwrite it: the app will refuse to
# start against captures the new key cannot open. Rotate it properly -- see
# "Rotating the master key" in docs/operating.md.
#
# A "secret ... not found" line right after `docker compose up -d` is Compose,
# not the app -- it can log that once while the secret's file mount is still
# settling. Give it a few seconds, then re-check `docker compose ps` and the
# logs before troubleshooting further.
#
# ----------------------------------------------------------------------------
# OWNERSHIP
#
# On each start the entrypoint chowns ssh-keys/, data/ and captures/ to the
# container's non-root user (appuser, UID 1000), because a bind mount arrives
# with whatever the host gave it. No manual chown needed -- but if your host
# account is NOT UID 1000, those three stop belonging to you after the first
# start and need sudo to inspect. secrets/ is left alone: the Docker daemon
# reads the key as root before the container exists.
#
# ----------------------------------------------------------------------------
# WHAT EACH SETTING IN THE BLOCK IS FOR
#
# ports             "8080:8080". Port 8080 taken? Change the LEFT half only --
#                   "8081:8080" publishes it on 8081. The right half is the port
#                   inside the container.
#
# COOKIE_SECURE     false lets sign-in work over plain HTTP, which is how a fresh
#                   install starts. Set it back to true once you are behind a
#                   reverse proxy (built-in HTTPS does not need it). After
#                   changing it -- or TRUST_PROXY_HEADERS -- run
#                   `docker compose up -d`, not `docker compose restart`: a
#                   restart (or stop + start) keeps the environment the
#                   container was created with, so the change does nothing.
#
# extra_hosts       Makes host.docker.internal resolve to this machine on plain
#                   Linux, where Docker does not provide it by default.
#                   Capturing from the machine that runs pcap-server records
#                   pcap-server's own traffic -- your sign-in included -- so it
#                   is refused, and pcap-server treats that name as the host.
#                   This gives the name an address the refusal can see.
#
# cap_drop/cap_add  Container hardening. The app itself runs as appuser with no
#                   capabilities at all: the entrypoint starts as root only long
#                   enough to hand the three directories to appuser, then drops
#                   to it. The five kept are for that root moment, and for the
#                   `docker compose run` and `exec` commands in
#                   docs/operating.md and docs/tls.md, which also start as root.
#                   CHOWN and DAC_OVERRIDE let the entrypoint take over a mount
#                   some other UID owns. FOWNER lets those commands update
#                   appuser's files, and SETUID/SETGID let root become appuser.
#                   Everything else Docker grants by default (NET_RAW, MKNOD,
#                   KILL, SETFCAP and the rest) goes. Capturing happens on the
#                   target host over SSH, never in here, so NET_RAW is not
#                   needed.
#
# security_opt      no-new-privileges: nothing inside can gain privileges
#                   through a setuid binary.
#
# read_only/tmpfs   The image cannot be modified at runtime. Everything the app
#                   writes goes to the three mounts, /tmp (in memory), or
#                   /dev/shm, where certificate issuance keeps its scratch
#                   files.
#
# ----------------------------------------------------------------------------
# OPTIONAL SETTINGS -- add these to the block only if you need them
#
# Under environment:
#
#   - HOST_ADDRESSES=192.168.1.10,10.0.0.5
#       The Docker host's own IP addresses. From inside a bridge network the
#       container can see loopback, its own addresses, the default gateway and
#       host.docker.internal, but NOT the host's LAN address, which is exactly
#       what a person types for their own machine. A stronger check (the
#       target's kernel boot id) catches it, but only once it can connect.
#       Naming the addresses here refuses them with no connection needed.
#       Comma-separated, IP addresses only.
#
#   - TRUST_PROXY_HEADERS=true
#       Behind a reverse proxy. See docs/reverse-proxy.md -- it matters who
#       else can reach the app's port once this is on.
#
#   - ENCRYPTION_MODE=passphrase
#       Derives the key from a passphrase an admin types after each start.
#       Nothing on disk can decrypt anything, but the app stays locked -- and
#       cannot capture -- until someone unlocks it. Drop MASTER_KEY_FILE, the
#       service's `secrets:` and the top-level `secrets:` block if you choose
#       this.
#
#   - ALLOW_UNENCRYPTED_CAPTURES=true
#       Runs without encryption. You must say so explicitly; the app will not
#       start with captures unprotected by accident.
#
# Under pcap-server:, alongside restart:
#
#   mem_limit: 1g
#       Defence in depth against a memory spike. Each password verification
#       runs scrypt, which is deliberately memory-hard (~128 MB per call); the
#       app caps how many run at once (PCAP_SCRYPT_CONCURRENCY, default 4), so
#       the login path alone stays well under this. A hard ceiling means even
#       an unforeseen allocation path cannot take the host down with it -- the
#       container is killed and restarted instead. Size it above your real
#       peak: the baseline is well under 200 MB, but parsing a very large
#       capture with tshark can spike transiently, so leave generous headroom
#       (a limit set too low will OOM-kill a legitimate large-capture view).
