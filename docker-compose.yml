# ============================================================================
# FIRST-TIME SETUP
# ============================================================================
#
# Put this file in the directory you want the install to live in -- that
# directory IS the install; see "Where the paths resolve" below -- then paste
# this block into a terminal standing in it. Every line is explained underneath.
#
#     mkdir -p ssh-keys data captures secrets
#     chmod 0700 ssh-keys data captures secrets
#     openssl rand -base64 32 > secrets/master.key
#     chmod 0400 secrets/master.key
#     docker compose up -d
#     docker compose ps
#     docker compose logs pcap-server | grep -i encryption
#
# You want `encryption enabled (key id ...)` from that last line, and `running`
# -- not `restarting` -- from `docker compose ps`. Then open
# http://<host>:8080 and create the admin account. Have an authenticator app to
# hand: TOTP enrolment is part of creating it.
#
# ----------------------------------------------------------------------------
# WHAT EACH LINE IS FOR
#
#   mkdir       The four directories this file bind-mounts. All four must exist
#               BEFORE the first start, or Docker creates them itself as
#               root-owned -- or creates a directory where you meant a file.
#
#   chmod 0700  Closes them to other accounts on this host. Not belt-and-braces:
#               at a default umask they are world-readable, and data/ holds the
#               SQLite database, which stores every user's TOTP secret as plain
#               text because the app has to compute codes from it. Anyone who
#               can read that file can produce a valid second factor for any
#               account. Password hashes are scrypt and sessions are kept as
#               digests, so those are a slower problem; the TOTP seeds are the
#               immediate one.
#
#   openssl     The master key, generated once, before the first start. The app
#               refuses to start without one rather than storing captures in the
#               clear. 0400 because it is the one file that opens all the rest.
#
# ----------------------------------------------------------------------------
# WHERE THE PATHS RESOLVE
#
# Every `./` path below is resolved by Docker relative to THE DIRECTORY THIS
# FILE IS IN -- not your home directory, and not wherever you happen to be
# standing when you type `docker compose`. So this file's location IS the
# install directory, and the four subdirectories sit next to it. Pick that
# directory deliberately: it will hold your captures and the key that decrypts
# them. /opt/docker/pcap is a reasonable choice on a Linux host:
#
#     sudo mkdir -p /opt/docker/pcap
#     sudo chown "$USER" /opt/docker/pcap
#     cd /opt/docker/pcap
#
# Run every later `docker compose` command from this directory too. Run it from
# somewhere else and Docker looks for a compose file that isn't there -- or, if
# one is, mounts that directory's data instead of yours.
#
# ----------------------------------------------------------------------------
# Prefer absolute paths? Supported, and worth it if anyone else will administer
# this host: nothing then depends on which directory the command was run from.
# Replace each `source:` and the `secrets: file:` at the bottom with a full
# path, keeping every `target:` exactly as it is:
#
#        source: /opt/docker/pcap/captures
#        target: /app/captures          # unchanged -- this is inside the container
#
# ----------------------------------------------------------------------------
# KEEP A COPY OF secrets/master.key SOMEWHERE ELSE. Captures are encrypted with
# it and there is no recovery path: lose the key and every stored capture is
# gone. Keep it OUT of data/ and captures/ -- a key stored beside the data it
# protects protects nothing.
#
# If that key is ever exposed, do not just overwrite it: the app will refuse to
# start against captures the new key cannot open. Rotate it properly --
# see "Rotating the master key" in the README.
#
# OWNERSHIP. On each start the entrypoint chowns ssh-keys/, data/ and captures/
# to the container's non-root user (appuser, UID 1000), because a bind mount
# arrives with whatever the host gave it. No manual chown needed -- but note
# that if your host account is NOT UID 1000, those three stop belonging to you
# after the first start and need sudo to inspect. secrets/ is left alone: the
# Docker daemon reads the key as root before the container exists.
#
# SSH keys are managed via the Admin panel in the web UI.
#
# Cookies require HTTPS by default. Set COOKIE_SECURE=false for plain HTTP.
#
# After changing COOKIE_SECURE or TRUST_PROXY_HEADERS, run `docker compose up -d`.
# `docker compose restart` (or stop + start) keeps the environment the container
# was created with, so the change silently does nothing.



# NOTE: The section below is the only text needed to be in the compose file
# after the folders, permissions, and master key are created. Anything preceded
# with a # can be deleted. The final filename should be compose.yaml.
#
# The paths below are absolute: /opt/docker/pcapserver is the install
# directory, and the four bind sources and the secret's file all name it in
# full. Installing somewhere else means changing them here -- they do not
# follow the directory the file happens to sit in.

services:
  pcap-server:
    image: ghcr.io/darthrater78/pcap-server:0.1.0-dev.36
    ports:
      - "8080:8080"
    volumes:
      - type: bind
        source: /opt/docker/pcapserver/ssh-keys
        target: /app/ssh-keys
      - type: bind
        source: /opt/docker/pcapserver/data
        target: /app/data
      - type: bind
        source: /opt/docker/pcapserver/captures
        target: /app/captures
    environment:
      - SSH_KEYS_DIR=/app/ssh-keys
      - CAPTURES_DIR=/app/captures
      - DATA_DIR=/app/data
      - COOKIE_SECURE=false
      # Where the master key is mounted. A file, not a variable: an environment
      # variable is readable via `docker inspect` and /proc/<pid>/environ.
      - MASTER_KEY_FILE=/run/secrets/pcap_master_key
      #
      # Alternative: ENCRYPTION_MODE=passphrase derives the key from a
      # passphrase an admin types after each start. Nothing on disk can decrypt
      # anything, but the app stays locked -- and cannot capture -- until
      # someone unlocks it. Drop MASTER_KEY_FILE and the secrets block if you
      # choose this.
      #
      # To run without encryption you must say so explicitly; the app will not
      # start with captures unprotected by accident:
      # - ALLOW_UNENCRYPTED_CAPTURES=true
      #
      # Capturing from the machine that runs pcap-server records pcap-server's
      # own traffic -- your sign-in included -- so it is refused. From inside a
      # bridge network the container can see loopback, its own addresses, the
      # default gateway and host.docker.internal, but NOT the host's LAN
      # address, which is exactly what a person types for their own machine.
      # There is a stronger check that catches it (the target's kernel boot id),
      # but it needs a connection to the target to run.
      #
      # Naming the host's addresses here closes that gap with no connection
      # needed, so it applies even to a host that is unreachable or not yet
      # trusted. Comma-separated, IP addresses only:
      # - HOST_ADDRESSES=192.168.1.10,10.0.0.5
    # Makes host.docker.internal resolve to this machine on plain Linux, where
    # Docker does not provide it by default. pcap-server already treats that
    # name as the host, so this turns "capture from host.docker.internal" into
    # an address the refusal can actually see.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    secrets:
      - pcap_master_key
    restart: unless-stopped

secrets:
  pcap_master_key:
    file: /opt/docker/pcapserver/secrets/master.key
